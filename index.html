<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://*.supabase.co; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>Controle de Validade</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="./favicon.ico" sizes="any">
</head>
<body>

<div id="login" class="card" style="max-width:380px;margin:40px auto">
 <h2>Controle de Validade</h2>
 <label>E-mail</label><input id="em" type="email" autocomplete="username">
 <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
 <p class="err" id="lerr"></p>
 <button class="btn" id="go" style="width:100%">Entrar</button>
</div>

<div id="app" hidden>
 <header><div><b id="who"></b><small id="role"></small></div><button class="btn s" id="out">Sair</button></header>
 <nav>
  <button data-t="anotar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
  <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
  <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
</svg> Anotar data</button>
  <button data-t="rel"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16">
  <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/>
  <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"/>
</svg> Relatório</button>
  <button data-t="exc"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
  <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
</svg> Excluídos</button>
 </nav>
 <main>
  <section id="t-anotar" class="card">
   <div id="lj-box"><label>Loja</label><select id="lj"></select></div>
   <label>Código EAN</label>
   <div class="row">
    <input id="ean" inputmode="numeric" autocomplete="off" placeholder="Digite, bipe ou use a câmera">
    <button class="btn s" id="cam" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-camera" viewBox="0 0 16 16">
  <path d="M15 12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1.172a3 3 0 0 0 2.12-.879l.83-.828A1 1 0 0 1 6.827 3h2.344a1 1 0 0 1 .707.293l.828.828A3 3 0 0 0 12.828 5H14a1 1 0 0 1 1 1zM2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4z"/>
  <path d="M8 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5m0 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M3 6.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0"/>
</svg></button>
   </div>
   <div id="chk" class="chk" hidden></div>
   <label>Quantidade</label><input id="qtd" type="number" inputmode="numeric" min="1" max="100000" placeholder="Ex.: 12">
   <label>Data de validade</label>
   <div class="row">
    <input id="dt" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" maxlength="10">
    <button class="btn s" id="cal" type="button" title="Abrir calendário"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar" viewBox="0 0 16 16">
  <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
</svg></button>
    <input type="date" id="dtp" class="pk" tabindex="-1" aria-hidden="true">
   </div>
   <p class="err" id="aerr"></p>
   <button class="btn" id="send" style="width:100%" disabled>Enviar</button>
  </section>

  <section id="t-rel" hidden>
   <div class="card" id="f-rel"></div>
   <div class="bar" id="adm-bar" hidden>
    <button class="btn s" id="xp"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-down-square-fill" viewBox="0 0 16 16">
  <path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm6.5 4.5v5.793l2.146-2.147a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 1 1 .708-.708L7.5 10.293V4.5a.5.5 0 0 1 1 0"/>
</svg> Exportar .pkl (sem descrição)</button>
    <button class="btn s" id="xc"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-down-square-fill" viewBox="0 0 16 16">
  <path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm6.5 4.5v5.793l2.146-2.147a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 1 1 .708-.708L7.5 10.293V4.5a.5.5 0 0 1 1 0"/>
</svg> Exportar .csv</button>
    <button class="btn s" id="ib"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-up-square-fill" viewBox="0 0 16 16">
  <path d="M2 16a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2zm6.5-4.5V5.707l2.146 2.147a.5.5 0 0 0 .708-.708l-3-3a.5.5 0 0 0-.708 0l-3 3a.5.5 0 1 0 .708.708L7.5 5.707V11.5a.5.5 0 0 0 1 0"/>
</svg> Importar .csv</button>
    <input type="file" id="imp" accept=".csv,text/csv" hidden>
   </div>
   <div id="rel-l"></div>
  </section>

  <section id="t-exc" hidden>
   <div class="card" id="f-exc"></div>
   <div id="exc-l"></div>
  </section>
 </main>
</div>

<dialog id="dd">
 <h3>Excluir produto</h3>
 <p id="dinfo"></p>
 <label>Quantidade a baixar</label><input id="dq" type="number" min="1">
 <label>Motivo</label>
 <select id="dm"><option>Passou da Validade</option><option>Venda no PDV</option><option>Erro</option><option>Outro</option></select>
 <div id="dtb" hidden><label>Descreva o motivo</label><input id="dt2" maxlength="200"></div>
 <div id="dpb" hidden><label>Sua senha (obrigatória para excluir)</label><input id="dp" type="password" autocomplete="current-password"></div>
 <p class="err" id="derr"></p>
 <div class="row"><button class="btn s" id="dc">Cancelar</button><button class="btn d" id="dok">Excluir</button></div>
</dialog>

<dialog id="ed">
 <h3>Editar produto</h3>
 <p id="einfo"></p>
 <label>Quantidade</label><input id="eq" type="number" min="1" max="100000">
 <label>Data de validade</label><input id="ev" type="date">
 <p class="err" id="eerr"></p>
 <div class="row"><button class="btn s" id="ec">Cancelar</button><button class="btn" id="eok">Salvar</button></div>
</dialog>

<dialog id="sd">
 <video id="vid" playsinline muted></video>
 <p>Aponte para o código de barras.</p>
 <button class="btn s" id="sc" style="width:100%">Fechar</button>
</dialog>

<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
